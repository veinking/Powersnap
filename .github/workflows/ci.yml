name: PowerSnap CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Verify required app files
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          grep -q 'fileInput' index.html
          grep -q 'PowerSnap' index.html
